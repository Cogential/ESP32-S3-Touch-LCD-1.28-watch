default_profile: esp32s3

profiles:
  esp32s3:
    fqbn: esp32:esp32:esp32s3:PartitionScheme=app3M_fat9M_16MB
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      # Preferences and BLE ship bundled with the esp32 core itself (pinned
      # above via the platform version) — listing them here as if they were
      # separate Library Manager packages just makes arduino-cli warn that
      # it can't find them, harmlessly, on every compile.
      - QMI8658 (1.0.1)
      - ArduinoJson (7.4.3)
      - LovyanGFX (1.2.27)
      - WiFiManager (2.0.17)
